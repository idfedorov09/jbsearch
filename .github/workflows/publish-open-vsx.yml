name: Publish to Open VSX

on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      authentication:
        description: Token for the first release; trusted after registering the publisher
        type: choice
        required: true
        default: token
        options:
          - token
          - trusted

concurrency:
  group: open-vsx-publication

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'idfedorov09/jbsearch' && ((github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/beta' && github.event_name == 'push' && github.event.deleted == false && github.event.forced == false))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run spec:check
      - name: Set release build timestamp
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          case "$epoch" in
            ''|*[!0-9]*)
              printf '%s\n' '::error::Commit timestamp must be nonempty and numeric.' >&2
              exit 1
              ;;
          esac
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"
      - name: Build stable package matrix
        if: github.ref == 'refs/heads/master'
        run: npm run package:matrix -- --out-dir "$RUNNER_TEMP/jbsearch-packages"
      - name: Build pre-release package matrix
        if: github.ref == 'refs/heads/beta'
        run: npm run package:matrix -- --pre-release --out-dir "$RUNNER_TEMP/jbsearch-packages"

  publish-token:
    if: github.repository == 'idfedorov09/jbsearch' && ((github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.authentication == 'token') || (github.ref == 'refs/heads/beta' && github.event_name == 'push' && github.event.deleted == false && github.event.forced == false))
    needs: check
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Set release build timestamp
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          case "$epoch" in
            ''|*[!0-9]*)
              printf '%s\n' '::error::Commit timestamp must be nonempty and numeric.' >&2
              exit 1
              ;;
          esac
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"
      - name: Build stable package matrix
        if: github.ref == 'refs/heads/master'
        run: npm run package:matrix -- --out-dir "$RUNNER_TEMP/jbsearch-packages"
      - name: Build pre-release package matrix
        if: github.ref == 'refs/heads/beta'
        run: npm run package:matrix -- --pre-release --out-dir "$RUNNER_TEMP/jbsearch-packages"
      - name: Publish and verify stable matrix with token
        if: github.ref == 'refs/heads/master'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Configure OVSX_PAT in the protected open-vsx environment.'
            exit 1
          fi
          node scripts/publish-platforms.js open-vsx stable token "$RUNNER_TEMP/jbsearch-packages"
      - name: Publish and verify pre-release matrix with token
        if: github.ref == 'refs/heads/beta'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Configure OVSX_PAT in the protected open-vsx environment.'
            exit 1
          fi
          node scripts/publish-platforms.js open-vsx pre-release token "$RUNNER_TEMP/jbsearch-packages"

  publish-trusted:
    if: github.repository == 'idfedorov09/jbsearch' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.authentication == 'trusted'
    needs: check
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Set release build timestamp
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          case "$epoch" in
            ''|*[!0-9]*)
              printf '%s\n' '::error::Commit timestamp must be nonempty and numeric.' >&2
              exit 1
              ;;
          esac
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"
      - name: Build stable package matrix
        run: npm run package:matrix -- --out-dir "$RUNNER_TEMP/jbsearch-packages"
      - name: Publish and verify stable matrix with trusted publishing
        run: node scripts/publish-platforms.js open-vsx stable trusted "$RUNNER_TEMP/jbsearch-packages"
