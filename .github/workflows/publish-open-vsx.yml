name: Publish to Open VSX

on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      authentication:
        description: Token for the first release; trusted after registering the publisher
        type: choice
        required: true
        default: token
        options:
          - token
          - trusted

concurrency:
  group: open-vsx-publication

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'idfedorov09/jbsearch' && ((github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch') || (github.ref == 'refs/heads/beta' && github.event_name == 'push' && github.event.deleted == false && github.event.forced == false))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run spec:check
      - name: Set beta build timestamp
        if: github.ref == 'refs/heads/beta'
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          case "$epoch" in
            ''|*[!0-9]*)
              printf '%s\n' '::error::Commit timestamp must be nonempty and numeric.' >&2
              exit 1
              ;;
          esac
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"
      - name: Build stable package
        if: github.ref == 'refs/heads/master'
        run: npm run package
      - name: Build pre-release package
        if: github.ref == 'refs/heads/beta'
        run: npm run package:pre-release

  publish-token:
    if: github.repository == 'idfedorov09/jbsearch' && ((github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.authentication == 'token') || (github.ref == 'refs/heads/beta' && github.event_name == 'push' && github.event.deleted == false && github.event.forced == false))
    needs: check
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Set beta build timestamp
        if: github.ref == 'refs/heads/beta'
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          case "$epoch" in
            ''|*[!0-9]*)
              printf '%s\n' '::error::Commit timestamp must be nonempty and numeric.' >&2
              exit 1
              ;;
          esac
          printf 'SOURCE_DATE_EPOCH=%s\n' "$epoch" >> "$GITHUB_ENV"
      - name: Build stable package
        if: github.ref == 'refs/heads/master'
        run: npm run package
      - name: Build pre-release package
        if: github.ref == 'refs/heads/beta'
        run: npm run package:pre-release
      - name: Publish verified stable VSIX with bootstrap token
        if: github.ref == 'refs/heads/master'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Configure OVSX_PAT in the protected open-vsx environment.'
            exit 1
          fi
          package="jbsearch-$(node -p 'require("./package.json").version').vsix"
          node scripts/publish-open-vsx.js "$package"
      - name: Publish and verify pre-release with token
        if: github.ref == 'refs/heads/beta'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo '::error::Configure OVSX_PAT in the protected open-vsx environment.'
            exit 1
          fi
          package="jbsearch-$(node -p 'require("./package.json").version').vsix"
          node scripts/publish-open-vsx.js "$package" --skip-duplicate
          node scripts/verify-published-beta.js open-vsx "$package"

  publish-trusted:
    if: github.repository == 'idfedorov09/jbsearch' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.authentication == 'trusted'
    needs: check
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - name: Publish verified VSIX with trusted publishing
        run: |
          package="jbsearch-$(node -p 'require("./package.json").version').vsix"
          ./node_modules/.bin/ovsx --registryUrl https://open-vsx.org publish "$package" --trusted-publishing
