name: Bug report
description: Report a problem with JB Search.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. For a security vulnerability,
        follow the [security policy](https://github.com/idfedorov09/jbsearch/security/policy)
        instead of opening a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and the actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps and include a minimal example if possible.
      placeholder: |
        1. Open ...
        2. Search for ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: JB Search version
      description: Provide the extension version, or the commit if running from source.
      placeholder: "For example: 0.2.1"
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: You can find this under Help → About.
      placeholder: "For example: 1.144.1"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Client operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Workspace environment
      options:
        - Local
        - Remote SSH
        - WSL
        - Dev Container or Codespaces
        - Other
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optionally add remote host details, logs, screenshots, or a minimal
        sample. Remove credentials, private source code, file paths, and search
        queries that you do not want to share publicly.
