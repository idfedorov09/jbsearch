schema: spec-driven

context: |
  Language: Russian
  All OpenSpec artifacts must be written in Russian.
  The root README.md must be written and maintained in English, including all future sections, examples, and descriptions.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  JB Search is a JavaScript/CommonJS VS Code extension. Find/Replace implementation is authorized and in progress. src/extension.js is the entry point; no source compilation. npm ci prepares a bundled UI-extension VSIX from client/ for Remote preview.
  Tooling: Node.js >=22.12.0, npm ci. Prefer stable public VS Code APIs.
  A stock VS Code modal/custom-editor probe passed on 1.144.1 Linux/X11;
  its internal opening command is an accepted isolated compatibility dependency.
  Read AGENTS.md and docs/adr. Work in dev; no commits/push/publication without request.
  Proposed changes describe future behavior, not existing implementation.
  User requirements: mandatory floating window; macOS, Windows and Linux from
  the first product iteration. Native modal + webview is implemented; macOS/Windows
  verification remains open. User confirmed Replace and TextMate preview, then
  authorized the client resource bridge on 2026-11-04 (ADR 0006).
  Remote preview uses two standard extensions: workspace idfedorov09.jbsearch
  and UI idfedorov09.jbsearch-client. The helper reads client theme/grammars,
  exchanges snapshots through VS Code commands, and is installed from the main
  bundled VSIX. No separate desktop app, socket, proposed API or product DOM injection.
  Queries and source contents stay in the workspace host; semantic tokens are not implemented in modal preview.
  Find Panel uses a native TreeView contributed to Panel; workbench resolves client
  file/folder icons via resourceUri + ThemeIcon.File/Folder (ADR 0008). Clicking a
  result opens an actual TextEditor in the active central group, without splitting.
  Saved searches switch through QuickPick; hiding keeps them, Close Search releases.
  Snapshot/INVALID/validation and isolated modal drafts from ADR 0007 remain.
  Source registration plus Reload Window remains supported; cross-machine Remote,
  macOS and Windows verification must not be inferred from Linux loopback tests.

rules:
  proposal:
    - Separate confirmed requirements, recommendations and open questions.
    - State scope, non-goals, platform limits and approval status explicitly.
  design:
    - Cite stable API evidence and link architecture decisions in docs/adr.
    - Never describe a webview tab as an arbitrary overlay above the workbench.
  specs:
    - Use testable user-visible requirements with WHEN/THEN scenarios.
    - Keep draft feature requirements inside the change until implemented and verified.
  tasks:
    - Include automated checks and a separate real VS Code manual checklist.
    - Do not mark future implementation tasks complete because a design exists.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
